# Pila de la VPS (diseño del informe de la II Unidad, secciones 5 a 7).
# Los datos del negocio viven en Supabase (externo); postgres_n8n solo guarda la base de n8n.
# El perfil "dev" agrega un PostgreSQL local para probar sin Supabase y NO se usa en producción.
name: reteque

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.7
    mem_limit: 96m
    cpus: 0.5
    ports: ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    cap_add: ["NET_BIND_SERVICE"]
    healthcheck: { test: ["CMD", "caddy", "version"], interval: 30s, timeout: 5s, retries: 3 }
    networks:
      net_edge: { ipv4_address: 172.30.10.2 }

  api:
    <<: *hardening
    build: { context: ../apps/api, dockerfile: Dockerfile }
    image: reteque/api:0.1.0
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    cpus: 1.0
    env_file: .env
    environment: { NODE_OPTIONS: "--max-old-space-size=384" }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 3 }
    networks:
      net_edge: { ipv4_address: 172.30.10.3 }
      net_app: { ipv4_address: 172.30.20.3 }

  outbox-worker:
    <<: *hardening
    image: reteque/api:0.1.0
    command: ["node", "src/worker.js"]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 256m
    cpus: 0.5
    env_file: .env
    depends_on: { api: { condition: service_healthy } }
    networks:
      net_app: { ipv4_address: 172.30.20.4 }

  n8n:
    <<: *hardening
    image: n8nio/n8n:2.45.7
    user: "1000:1000"
    mem_limit: 1280m
    cpus: 1.5
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_DATABASE: n8n
      N8N_PROTOCOL: https
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes: ["n8n_data:/home/node/.n8n"]
    ports: ["10.99.0.1:5678:5678"]   # solo por la interfaz wg0
    depends_on: { postgres_n8n: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"], interval: 30s, timeout: 5s, retries: 5 }
    networks:
      net_app: { ipv4_address: 172.30.20.5 }
      net_data: { ipv4_address: 172.30.30.5 }

  postgres_n8n:
    <<: *hardening
    image: postgres:17.11
    mem_limit: 640m
    cpus: 1.0
    env_file: .env
    environment: { POSTGRES_DB: n8n }
    volumes: ["pg_n8n:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"], interval: 15s, timeout: 5s, retries: 5 }
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_READ_SEARCH"]
    networks:
      net_data: { ipv4_address: 172.30.30.2 }

  postgres_negocio:     # SOLO desarrollo: sustituye a Supabase para pruebas locales
    <<: *hardening
    profiles: ["dev"]
    image: postgres:17.11
    mem_limit: 256m
    env_file: .env
    environment: { POSTGRES_DB: restaurante }
    volumes: ["pg_negocio:/var/lib/postgresql/data", "../database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_READ_SEARCH"]
    networks:
      net_app: { ipv4_address: 172.30.20.6 }

networks:
  net_edge: { driver: bridge, ipam: { config: [{ subnet: 172.30.10.0/24, gateway: 172.30.10.1 }] } }
  net_app:  { driver: bridge, ipam: { config: [{ subnet: 172.30.20.0/24, gateway: 172.30.20.1 }] } }
  net_data: { driver: bridge, internal: true, ipam: { config: [{ subnet: 172.30.30.0/24, gateway: 172.30.30.1 }] } }

volumes: { caddy_data: {}, n8n_data: {}, pg_n8n: {}, pg_negocio: {} }
